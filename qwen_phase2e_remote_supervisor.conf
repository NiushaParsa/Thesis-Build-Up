[program:qwen-phase2e-lr-grid]
environment=PROC_NAME="%(program_name)s"
command=/bin/bash /opt/supervisor-scripts/qwen-phase2e-lr-grid.sh
autostart=false
autorestart=false
exitcodes=0
startsecs=0
startretries=0
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=120
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_events_enabled=true
stdout_logfile_maxbytes=0
stdout_logfile_backups=0
